<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E26"/>
      <stop offset="100%" stop-color="#0B0B0E"/>
    </linearGradient>
    <linearGradient id="favOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="50%" stop-color="#FF5E00"/>
      <stop offset="100%" stop-color="#FF2A00"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="rgba(255, 94, 0, 0.5)"/>
    </filter>
  </defs>
  
  <!-- Obsidian Squircle Chassis -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5"/>
  
  <!-- Specular Light Rim -->
  <rect x="3.8" y="3.8" width="56.4" height="56.4" rx="14.2" fill="none" stroke="rgba(255, 94, 0, 0.25)" stroke-width="1"/>

  <!-- Left Monogram Pillar -->
  <rect x="15" y="16" width="6.5" height="32" rx="3.25" fill="url(#favOrange)" filter="url(#favGlow)"/>
  
  <!-- 'B' Upper Structural Loop -->
  <path d="M18 16H31C35.5 16 39 19.5 39 24C39 28.5 35.5 32 31 32H18" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- 'B' Lower Loop / 'N' Kinetic Foundation -->
  <path d="M18 32H32.5C37.5 32 41.5 36 41.5 40.5C41.5 44 38.5 48 35 48H18" 
        stroke="url(#favOrange)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#favGlow)"/>
        
  <!-- 'N' Kinetic Diagonal Slash -->
  <path d="M30 19.5L43.5 43.5" 
        stroke="url(#favOrange)" 
        stroke-width="4.5" 
        stroke-linecap="round"/>
        
  <!-- Spatial Orange Energy Core Node -->
  <circle cx="44" cy="18" r="3.2" fill="#FFA500" filter="url(#favGlow)"/>
</svg>
