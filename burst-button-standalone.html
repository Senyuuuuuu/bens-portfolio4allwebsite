<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- High-DPI Favicon & Web App Touch Icons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="BENYAMIN">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0B0B0E">

<title>Modeling Portfolio Interactive Burst Button — Standalone Component</title>
  
  <!-- Inter & Geometric Display Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- GSAP Core & ScrollTrigger CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    /* =========================================================================
       RESET & BASE TOKENS
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: #FFFFFF;
      font-size: 16px;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #FFFFFF;
      color: #18181B;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* =========================================================================
       PHASE 1: THE CONTAINER (PURE WHITE + #F0F0F0 50px ENGINEERING GRID)
       ========================================================================= */
    .burst-section-stage {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.5rem;
      background-color: #FFFFFF;
      background-image: 
        linear-gradient(to right, #F0F0F0 1px, transparent 1px),
        linear-gradient(to bottom, #F0F0F0 1px, transparent 1px);
      background-size: 50px 50px;
      background-position: center center;
      overflow: visible;
    }

    .burst-stage-inner {
      position: relative;
      z-index: 2;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* =========================================================================
       PHASE 3: ENTRANCE MASK WRAPPERS & SECTION TYPOGRAPHY
       ========================================================================= */
    .burst-overline-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1.15rem;
      border-radius: 999px;
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.08);
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #FF4500;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      margin-bottom: 1.5rem;
      will-change: transform, opacity;
    }

    .burst-headline-mask {
      overflow: hidden;
      padding-bottom: 0.2rem;
      margin-bottom: 1rem;
    }

    .burst-headline {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      font-size: clamp(2.4rem, 5vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.15;
      color: #18181B;
      margin: 0;
      will-change: transform, opacity;
    }

    .burst-headline .accent-serif {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 600;
      color: #FF4500;
    }

    .burst-subtext-mask {
      overflow: hidden;
      margin-bottom: 2.75rem;
      max-width: 620px;
    }

    .burst-subtext {
      font-size: clamp(1rem, 1.35vw, 1.15rem);
      line-height: 1.6;
      color: #52525B;
      font-weight: 450;
      will-change: transform, opacity;
    }

    /* =========================================================================
       PHASE 1: BUTTON WRAPPER & ARCHITECTURE
       ========================================================================= */
    .modeling-burst-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      z-index: 10;
      will-change: transform, opacity;
    }

    /* The Main Button: Pill Shape, Pure White, 2px Burnt Orange (#FF4500) Border */
    .modeling-burst-btn {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 36px;
      border-radius: 999px;
      background-color: #FFFFFF;
      border: 2px solid #FF4500;
      color: #111111;
      text-decoration: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      box-shadow: 0 4px 14px rgba(255, 69, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      will-change: transform, box-shadow;
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .modeling-burst-btn:active {
      transform: scale(0.97);
    }

    /* Solid Orange Camera Icon (Left) */
    .btn-camera-icon {
      width: 19px;
      height: 19px;
      fill: #FF4500;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Dark Charcoal Geometric Sans-Serif Text */
    .btn-text {
      color: #111111;
      white-space: nowrap;
      font-weight: 700;
    }

    /* Orange External Link Icon (Right) */
    .btn-link-icon {
      width: 14px;
      height: 14px;
      stroke: #FF4500;
      stroke-width: 2.5;
      fill: none;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .modeling-burst-btn:hover .btn-link-icon {
      transform: translate(2px, -2px);
    }

    /* =========================================================================
       PHASE 1: THE FOUR HIDDEN POP-OUT ICONS
       Position: Dead-Center behind button (z-index: -1), scale: 0, opacity: 0
       ========================================================================= */
    .pop-out-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: -1;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0);
      transform-origin: center center;
      will-change: transform, opacity;
      display: block;
    }

    /* 1. Black Sunglasses (Top-Left Corner) */
    .pop-icon-sunglasses {
      width: 32px;
      height: 32px;
      fill: #111111;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.16));
    }

    /* 2. Black Glasses (Top-Right Corner) */
    .pop-icon-glasses {
      width: 28px;
      height: 28px;
      stroke: #111111;
      fill: none;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.16));
    }

    /* 3. Solid Orange Star (Bottom-Left Corner) */
    .pop-icon-star {
      width: 24px;
      height: 24px;
      fill: #FF4500;
      filter: drop-shadow(0 6px 16px rgba(255, 69, 0, 0.45));
    }

    /* 4. Solid Orange Camera (Bottom-Right Corner) */
    .pop-icon-camera {
      width: 24px;
      height: 24px;
      fill: #FF4500;
      filter: drop-shadow(0 6px 16px rgba(255, 69, 0, 0.45));
    }

    /* =========================================================================
       ACCESSIBILITY & PREFERS-REDUCED-MOTION
       ========================================================================= */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .pop-out-icon {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- PHASE 1: SECTION CONTAINER WITH 50px ENGINEERING GRID (#F0F0F0) -->
  <section class="burst-section-stage" id="modelingSection" role="region" aria-label="Modeling Portfolio Showcase">
    <div class="burst-stage-inner">
      
      <!-- Section Eyebrow -->
      <div class="burst-overline-badge" id="burstOverline">
        ✦ 9:16 FASHION &amp; PORTRAIT GALLERY
      </div>

      <!-- Section Headline Masked Slide-Up -->
      <div class="burst-headline-mask">
        <h2 class="burst-headline" id="burstHeadline">
          Visual presence that demands <span class="accent-serif">attention</span>.
        </h2>
      </div>

      <!-- Section Subtext Masked Slide-Up -->
      <div class="burst-subtext-mask">
        <p class="burst-subtext" id="burstSubtext">
          High-fashion editorial showcases, precision agency composite cards, and cinematic studio portraits curated in full 9:16 vertical resolution.
        </p>
      </div>

      <!-- THE MAIN INTERACTIVE BURST BUTTON COMPONENT -->
      <div class="modeling-burst-wrapper" id="modelingBurstWrapper">
        
        <!-- Pop-Out Icon 1: Black Sunglasses (Shoots Top-Left) -->
        <svg class="pop-out-icon pop-icon-sunglasses" width="32" height="32" viewBox="0 0 32 32" fill="#111111" aria-hidden="true">
          <path d="M3.2 10.8C6.5 10 10.8 10.2 14.5 11.5c.7.2 1.3.4 2 .4s1.3-.2 2-.4c3.7-1.3 8-1.5 11.3-.7.9.2 1.5 1 1.4 2l-1.2 6.5c-.5 2.5-2.6 4.3-5.2 4.3-2.8 0-5.2-2-5.7-4.8-.2-1-.8-1.8-1.8-1.8s-1.6.8-1.8 1.8c-.5 2.8-2.9 4.8-5.7 4.8-2.6 0-4.7-1.8-5.2-4.3L1.8 12.8c-.1-1 .5-1.8 1.4-2z"/>
        </svg>

        <!-- Pop-Out Icon 2: Black Glasses (Shoots Top-Right) -->
        <svg class="pop-out-icon pop-icon-glasses" width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="16" r="6"/>
          <circle cx="23" cy="16" r="6"/>
          <path d="M15 15.5c1-1 3-1 4 0"/>
          <path d="M3 15.5l2 0.5"/>
          <path d="M29 15.5l-2 0.5"/>
        </svg>

        <!-- Pop-Out Icon 3: Solid Orange Star (Shoots Bottom-Left) -->
        <svg class="pop-out-icon pop-icon-star" width="24" height="24" viewBox="0 0 24 24" fill="#FF4500" aria-hidden="true">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>

        <!-- Pop-Out Icon 4: Solid Orange Camera (Shoots Bottom-Right) -->
        <svg class="pop-out-icon pop-icon-camera" width="24" height="24" viewBox="0 0 24 24" fill="#FF4500" aria-hidden="true">
          <path d="M4 7h3.17L8.85 4.74A2 2 0 0 1 10.5 4h3a2 2 0 0 1 1.65.74L16.83 7H20a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3zm8 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-2a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
        </svg>

        <!-- Main Button: Pill-Shaped with 2px Burnt Orange Border -->
        <a href="https://bensmodelingportfolio.netlify.app/" target="_blank" rel="noopener noreferrer" class="modeling-burst-btn" id="modelingBurstBtn" aria-label="Open 9:16 Modeling Portfolio Gallery">
          <!-- Left: Solid Orange Camera Icon -->
          <svg class="btn-camera-icon" width="19" height="19" viewBox="0 0 24 24" fill="#FF4500" aria-hidden="true">
            <path d="M4 7h3.17L8.85 4.74A2 2 0 0 1 10.5 4h3a2 2 0 0 1 1.65.74L16.83 7H20a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3zm8 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-2a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
          </svg>
          
          <!-- Center: Geometric Dark Charcoal Text -->
          <span class="btn-text">Modeling Portfolio</span>
          
          <!-- Right: Orange External Link Icon -->
          <svg class="btn-link-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF4500" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </a>

      </div>

    </div>
  </section>

  <!-- =========================================================================
       GSAP INTERACTION ENGINE (PHASE 2 & PHASE 3)
       ========================================================================= -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Register GSAP Plugins
      gsap.registerPlugin(ScrollTrigger);

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Element References
      const section = document.getElementById('modelingSection');
      const overline = document.getElementById('burstOverline');
      const headline = document.getElementById('burstHeadline');
      const subtext = document.getElementById('burstSubtext');
      const wrapper = document.getElementById('modelingBurstWrapper');
      const btn = document.getElementById('modelingBurstBtn');

      const sunglasses = wrapper.querySelector('.pop-icon-sunglasses');
      const glasses = wrapper.querySelector('.pop-icon-glasses');
      const star = wrapper.querySelector('.pop-icon-star');
      const camera = wrapper.querySelector('.pop-icon-camera');
      const popIcons = [sunglasses, glasses, star, camera];

      /* -----------------------------------------------------------------------
         PHASE 1: INITIAL STATE CONFIGURATION (Hardware-Accelerated)
         ----------------------------------------------------------------------- */
      gsap.set(popIcons, {
        xPercent: -50,
        yPercent: -50,
        x: 0,
        y: 0,
        scale: 0,
        opacity: 0,
        transformOrigin: '50% 50%',
        force3D: true
      });

      gsap.set([overline, headline, subtext], {
        y: 45,
        opacity: 0,
        force3D: true
      });

      gsap.set(wrapper, {
        scale: 0.8,
        opacity: 0,
        force3D: true
      });

      /* -----------------------------------------------------------------------
         PHASE 3: ENTRANCE ANIMATION (SEQUENCED REVEAL ON LOAD & SCROLL)
         ----------------------------------------------------------------------- */
      function createEntranceTimeline() {
        const tl = gsap.timeline({
          paused: true,
          defaults: { ease: 'power3.out' }
        });

        if (prefersReducedMotion) {
          // Instant graceful fallback
          tl.to([overline, headline, subtext, wrapper], {
            y: 0,
            scale: 1,
            opacity: 1,
            duration: 0.4,
            stagger: 0.08
          });
          return tl;
        }

        // 1. Text slide-up from invisible overflow mask in rapid sequence
        tl.to(overline, {
          y: 0,
          opacity: 1,
          duration: 0.65,
          ease: 'power3.out'
        }, 0)
        .to(headline, {
          y: 0,
          opacity: 1,
          duration: 0.8,
          ease: 'power3.out'
        }, 0.12)
        .to(subtext, {
          y: 0,
          opacity: 1,
          duration: 0.8,
          ease: 'power3.out'
        }, 0.22)
        // 2. Immediately after text, button pops in with premium spring ease back.out(1.5)
        .to(wrapper, {
          scale: 1,
          opacity: 1,
          duration: 0.9,
          ease: 'back.out(1.5)'
        }, 0.38);

        return tl;
      }

      const entranceTimeline = createEntranceTimeline();

      // Bind ScrollTrigger (15% into viewport) or immediate play if hero section
      ScrollTrigger.create({
        trigger: section,
        start: 'top 85%', // Triggers as container enters 15% into viewport
        once: true,
        onEnter: () => entranceTimeline.play()
      });

      // If page is already loaded with section in view, ensure trigger runs
      ScrollTrigger.refresh();

      /* -----------------------------------------------------------------------
         PHASE 2: HOVER MECHANICS (THE ERUPTION & RETRACTION)
         ----------------------------------------------------------------------- */
      let burstTimeline = null;

      btn.addEventListener('mouseenter', () => {
        if (prefersReducedMotion) return;

        if (burstTimeline) burstTimeline.kill();
        burstTimeline = gsap.timeline();

        // 1. Soft glowing orange drop shadow on button
        burstTimeline.to(btn, {
          boxShadow: '0 14px 34px rgba(255, 69, 0, 0.38), 0 0 24px rgba(255, 69, 0, 0.22)',
          duration: 0.32,
          ease: 'power2.out'
        }, 0);

        // 2. Shoot 4 hidden icons to 4 corners with elastic wobble physics
        // Top-Left: Black Sunglasses
        burstTimeline.to(sunglasses, {
          x: -122,
          y: -54,
          rotation: -14,
          scale: 1,
          opacity: 1,
          duration: 0.85,
          ease: 'elastic.out(1, 0.6)'
        }, 0);

        // Top-Right: Black Glasses
        burstTimeline.to(glasses, {
          x: 122,
          y: -54,
          rotation: 14,
          scale: 1,
          opacity: 1,
          duration: 0.85,
          ease: 'elastic.out(1, 0.6)'
        }, 0);

        // Bottom-Left: Solid Orange Star
        burstTimeline.to(star, {
          x: -112,
          y: 54,
          rotation: -18,
          scale: 1,
          opacity: 1,
          duration: 0.85,
          ease: 'elastic.out(1, 0.6)'
        }, 0);

        // Bottom-Right: Solid Orange Camera
        burstTimeline.to(camera, {
          x: 112,
          y: 54,
          rotation: 16,
          scale: 1,
          opacity: 1,
          duration: 0.85,
          ease: 'elastic.out(1, 0.6)'
        }, 0);
      });

      btn.addEventListener('mouseleave', () => {
        if (prefersReducedMotion) return;

        if (burstTimeline) burstTimeline.kill();
        burstTimeline = gsap.timeline();

        // 1. Orange glow fades out cleanly
        burstTimeline.to(btn, {
          boxShadow: '0 4px 14px rgba(255, 69, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04)',
          duration: 0.28,
          ease: 'power3.inOut'
        }, 0);

        // 2. Rapidly suck 4 icons back to exact center (x: 0, y: 0), scale: 0, opacity: 0
        burstTimeline.to(popIcons, {
          x: 0,
          y: 0,
          rotation: 0,
          scale: 0,
          opacity: 0,
          duration: 0.3,
          ease: 'power3.inOut'
        }, 0);
      });
    });
  </script>
</body>
</html>
