<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>HyperFrames Showcase Demo</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- GSAP CDN -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        margin: 0;
        background: #030712;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }

      /* Root HyperFrames Composition Canvas (1920x1080) */
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #030712;
      }

      .bg-gradient {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 25%, #1e1b4b 0%, #030712 100%);
      }
      .bg-grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
        background-size: 64px 64px;
        opacity: 0.45;
      }
      .glow-orb {
        position: absolute;
        width: 700px;
        height: 700px;
        left: 50%;
        top: 40%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(99, 102, 241, 0) 70%);
        filter: blur(50px);
        pointer-events: none;
      }

      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* Scene 1 Elements */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 14px 32px;
        background: rgba(99, 102, 241, 0.18);
        border: 1px solid rgba(129, 140, 248, 0.4);
        border-radius: 9999px;
        color: #c7d2fe;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 2px;
        margin-bottom: 28px;
        backdrop-filter: blur(12px);
        box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
      }
      .hero-title {
        font-size: 104px;
        font-weight: 900;
        letter-spacing: -3px;
        text-align: center;
        line-height: 1.12;
        background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 55%, #64748b 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Scene 2 Elements */
      .cards-container {
        display: grid;
        grid-template-columns: repeat(3, 440px);
        gap: 36px;
      }
      .feature-card {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 32px;
        padding: 52px 40px;
        text-align: center;
        backdrop-filter: blur(20px);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      }
      .card-stat {
        font-size: 72px;
        font-weight: 900;
        letter-spacing: -2px;
        background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .card-title {
        font-size: 28px;
        font-weight: 800;
        margin-top: 18px;
        color: #ffffff;
      }
      .card-desc {
        font-size: 20px;
        color: #94a3b8;
        margin-top: 10px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <!-- Standard HyperFrames Root Composition -->
    <div
      id="root"
      data-composition-id="demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="6"
    >
      <div class="bg-gradient"></div>
      <div class="bg-grid"></div>
      <div id="orb" class="glow-orb"></div>

      <!-- Scene 1: 0s to 3.2s -->
      <section id="scene-1" class="clip" data-start="0" data-duration="3.2" data-track-index="1">
        <div id="badge-1" class="badge">⚡ HYPERFRAMES VIDEO ENGINE</div>
        <h1 id="title-1" class="hero-title">Video From Code.<br/>Rendered at 60 FPS.</h1>
      </section>

      <!-- Scene 2: 3.0s to 6.0s -->
      <section id="scene-2" class="clip" data-start="3.0" data-duration="3.0" data-track-index="2">
        <div class="cards-container">
          <div class="feature-card" id="card-1">
            <div class="card-stat">0ms</div>
            <div class="card-title">Zero Framedrops</div>
            <div class="card-desc">Deterministic seekable time</div>
          </div>
          <div class="feature-card" id="card-2">
            <div class="card-stat">4K 60</div>
            <div class="card-title">Ultra HD Quality</div>
            <div class="card-desc">Chromium GPU acceleration</div>
          </div>
          <div class="feature-card" id="card-3">
            <div class="card-stat">HTML+CSS</div>
            <div class="card-title">Pure Web Power</div>
            <div class="card-desc">Native GSAP & Lottie support</div>
          </div>
        </div>
      </section>
    </div>

    <!-- Master GSAP Animation -->
    <script>
      // 1. Build Master GSAP Timeline (paused by default per HyperFrames contract)
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Background ambient orb
      tl.fromTo("#orb", 
        { scale: 0.7, opacity: 0.3 }, 
        { scale: 1.3, opacity: 0.75, duration: 6, ease: "sine.inOut" }, 
        0
      );

      // Scene 1 Enter
      tl.fromTo("#badge-1", 
        { y: -50, opacity: 0, scale: 0.85 }, 
        { y: 0, opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.7)" }, 
        0.2
      );

      tl.fromTo("#title-1", 
        { y: 70, opacity: 0, scale: 0.92 }, 
        { y: 0, opacity: 1, scale: 1, duration: 0.85, ease: "power3.out" }, 
        0.4
      );

      // Scene 1 Exit Transition
      tl.to("#scene-1", {
        scale: 1.08,
        opacity: 0,
        filter: "blur(14px)",
        duration: 0.5,
        ease: "power2.in"
      }, 2.7);

      // Scene 2 Enter
      tl.fromTo(".feature-card", 
        { y: 90, opacity: 0, scale: 0.85 }, 
        { 
          y: 0, 
          opacity: 1, 
          scale: 1, 
          duration: 0.8, 
          stagger: 0.15, 
          ease: "power3.out" 
        }, 
        3.0
      );

      // Scene 2 Exit
      tl.to("#scene-2", {
        scale: 0.95,
        opacity: 0,
        filter: "blur(10px)",
        duration: 0.4,
        ease: "power2.in"
      }, 5.6);

      // Register master timeline
      window.__timelines["demo"] = tl;
    </script>
  </body>
</html>
